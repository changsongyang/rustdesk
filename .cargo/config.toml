[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-args=/NODEFAULTLIB:MSVCRT"]
[target.'cfg(target_os="macos")']
rustflags = [
    "-C", "link-args=-sectcreate __CGPreLoginApp __cgpreloginapp /dev/null",
]
#[target.'cfg(target_os="linux")']
# glibc-static required, this may fix https://github.com/rustdesk/rustdesk/issues/9103, but I do not want this big change
# this is unlikely to help also, because the other so files still use libc dynamically
#rustflags = [
#    "-C", "link-args=-Wl,-Bstatic -lc -Wl,-Bdynamic"
#]
[net]
git-fetch-with-cli = true

[source.crates-io]
replace-with = "ustc"

[source.ustc]
registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
# registry = "git://mirrors.ustc.edu.cn/crates.io-index"
# 若无法使用 sparse 协议，尝试使用 git 协议

[source.tuna]
registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[source.rsj]
registry = "sparse+https://rsproxy.cn/crates.io-index/"

[source.netease]
registry = "sparse+https://mirrors.cloud.tencent.com/crates.io-index/"

[target.aarch64-linux-android]
linker = "aarch64-linux-android34-clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi34-clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
]

[target.x86_64-linux-android]
linker = "x86_64-linux-android34-clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
]

[target.i686-linux-android]
linker = "i686-linux-android34-clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
]

[target.aarch64-apple-ios]
rustflags = [
    "-C", "link-args=-Wl,-iphoneos_version_min,13.0",
]

[target.x86_64-apple-ios]
rustflags = [
    "-C", "link-args=-Wl,-iphoneos_version_min,13.0",
]

[target.aarch64-apple-ios-sim]
rustflags = [
    "-C", "link-args=-Wl,-ios_simulator_version_min,13.0",
]
