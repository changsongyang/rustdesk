apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustdesk-leader-election
  namespace: rustdesk
  labels:
    app.kubernetes.io/name: rustdesk
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustdesk-leader-election
  namespace: rustdesk
  labels:
    app.kubernetes.io/name: rustdesk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rustdesk-leader-election
subjects:
  - kind: ServiceAccount
    name: rustdesk
    namespace: rustdesk
