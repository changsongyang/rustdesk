global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'changeme'

templates:
  - '/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'
      continue: true
    - match:
        service: rustdesk
      receiver: 'rustdesk-receiver'
      group_wait: 5s

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'oncall@example.com'
        send_resolved: true
        headers:
          subject: '{% raw %}{{ .GroupLabels.alertname }}{% endraw %} - 告警通知'

  - name: 'critical-receiver'
    email_configs:
      - to: 'critical-alerts@example.com'
        send_resolved: true
        headers:
          subject: '【严重】{% raw %}{{ .GroupLabels.alertname }}{% endraw %}'
    webhook_configs:
      - url: 'http://webhook-server:5000/alerts'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
        channel: '#critical-alerts'
        send_resolved: true
        title: '【严重告警】{% raw %}{{ .GroupLabels.alertname }}{% endraw %}'
        text: |
          {% raw %}{{ range .Alerts }}
          *告警名称*: {{ .Labels.alertname }}
          *严重程度*: {{ .Labels.severity }}
          *描述*: {{ .Annotations.description }}
          *实例*: {{ .Labels.instance }}
          *时间*: {{ .StartsAt }}
          {{ end }}{% endraw %}

  - name: 'warning-receiver'
    email_configs:
      - to: 'warnings@example.com'
        send_resolved: true
        headers:
          subject: '【警告】{% raw %}{{ .GroupLabels.alertname }}{% endraw %}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
        channel: '#warnings'
        send_resolved: true
        title: '【警告告警】{% raw %}{{ .GroupLabels.alertname }}{% endraw %}'

  - name: 'rustdesk-receiver'
    email_configs:
      - to: 'rustdesk-team@example.com'
        send_resolved: true
        headers:
          subject: 'RustDesk {% raw %}{{ .GroupLabels.alertname }}{% endraw %}'
    webhook_configs:
      - url: 'http://rustdesk-webhook:8080/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  - source_match:
      alertname: 'RustDeskServerDown'
    target_match_re:
      alertname: 'RustDesk.*'
    equal: ['instance']

  - source_match:
      alertname: 'ServerHighCPU'
    target_match_re:
      alertname: 'Server.*'
    equal: ['instance']
