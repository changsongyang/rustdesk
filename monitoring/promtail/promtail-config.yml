server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/log/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: rustdesk

scrape_configs:
  - job_name: rustdesk-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: rustdesk
          __path__: /var/log/rustdesk/*.log
          service: rustdesk
          environment: production

      - targets:
          - localhost
        labels:
          job: rustdesk-hbbs
          __path__: /var/log/rustdesk/hbbs.log
          service: rustdesk-hbbs
          component: rendezvous
          environment: production

      - targets:
          - localhost
        labels:
          job: rustdesk-hbbr
          __path__: /var/log/rustdesk/hbbr.log
          service: rustdesk-hbbr
          component: relay
          environment: production

  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['rustdesk']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_service']
        target_label: service
      - source_labels: ['__meta_docker_container_label_component']
        target_label: component
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - action: labelmap
        regex: '__meta_docker_container_label_(.*)'

  - job_name: system-logs
    syslog:
      listen_address: 0.0.0.0:1514
      labels:
        job: system-syslog
        service: syslog
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: hostname
      - action: labelmap
        regex: __syslog_message_severity
        replacement: severity
      - action: labelmap
        regex: __syslog_message_facility
        replacement: facility

  - job_name: journal-logs
    journal:
      max_age: 12h
      labels:
        job: system-journal
        service: journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      - source_labels: ['__journal_priority']
        target_label: priority
      - source_labels: ['__journal_container_name']
        target_label: container_name
      - source_labels: ['__journal_container_id']
        target_label: container_id
